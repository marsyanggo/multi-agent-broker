[project]
name = "multi-agent-broker"
version = "0.1.0"
description = "LLM-agnostic multi-agent collaboration broker"
authors = [{ name = "Mars Yang", email = "marsyanggo@gmail.com" }]
license = { text = "Apache-2.0" }
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "websockets>=12.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.1",
    "aiosqlite>=0.19",
    "mcp>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
mab-broker = "mab.broker.cli:main"
mab-agent = "mab.mcp_server.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mab"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
